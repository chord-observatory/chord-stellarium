<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="The sky above the CHORD pathfinder at DRAO: the radio sky, the beam, sources and pulsars, now or at any time." />
  <title>CHORD observatory</title>
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <!--
    A static page: everything is computed in the browser from the clock
    (astro.js), the 408 MHz map (sky.png) and two JSON files.  site.json
    is edited by hand (site, array, pointings, dumps); catalog.json is
    generated by observatory/build_catalog.py in chord-sysops.  Deployed
    by the proxy_nginx role with the rest of the web root.

    URL fragment: #t=2026-10-30T10:59:20Z&p=taua&v=dome&f=400-800 ...
    (written as the view changes), and #kiosk for wall displays.
  -->
  <style>
    :root {
      --font: "IBM Plex Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --bg: #04070f;
      --panel: rgba(11, 16, 29, 0.84);
      --panel-solid: #0b101d;
      --ink: #e2e7f1;
      --muted: #97a3ba;
      --faint: #66728a;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #8fd3ff;
      --gold: #ffd479;
      --pulsar: #7fdfff;
      --dump: #ff86d8;
      --low: rgb(255, 92, 74);
      --high: rgb(196, 92, 255);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font); }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #ov, #fx { pointer-events: none; }
    #trace { top: auto; bottom: 0; height: 120px; width: auto; pointer-events: none; background: linear-gradient(180deg, rgba(4,7,15,0), rgba(4,7,15,0.82) 22%); }
    #sky { cursor: grab; touch-action: none; }
    #sky.dragging { cursor: grabbing; }
    button, input, select { font: inherit; color: inherit; }
    b, strong, h2 { font-weight: 600; }

    #panel {
      position: fixed; top: 12px; left: 12px; bottom: 12px; width: 312px;
      background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain;
      padding: 14px 14px 10px; scrollbar-width: thin;
    }
    .brand { display: flex; align-items: baseline; gap: 8px; }
    .brand b { letter-spacing: 0.14em; font-size: 15px; }
    .brand span { color: var(--muted); letter-spacing: 0.06em; }
    .site { color: var(--faint); font-size: 11px; margin: 1px 0 10px; }
    section { border-top: 1px solid var(--line); padding: 10px 0 8px; }
    h2 { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 7px; display: flex; justify-content: space-between; }
    h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }

    #t-local { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
    .sub { color: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 11.5px; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
    .btn {
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 9px; cursor: pointer; line-height: 1.3; min-height: 26px;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.09); }
    .btn[aria-pressed="true"] { background: rgba(143, 211, 255, 0.16); border-color: rgba(143, 211, 255, 0.55); color: #d9f0ff; }
    .seg { display: inline-flex; }
    .seg .btn + .btn { border-left: 0; }
    .live-dot { display: inline-block; width: 7px; height: 7px; background: #5fdc8f; margin-right: 6px; vertical-align: 1px; }
    .btn:not([aria-pressed="true"]) .live-dot { background: var(--faint); }
    #speed { color: var(--muted); font-family: var(--mono); font-size: 11.5px; margin-left: auto; }
    input[type="datetime-local"], input[type="number"], input[type="search"] {
      background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.14); padding: 3px 6px; min-height: 26px;
      color-scheme: dark;
    }
    input[type="number"] { width: 72px; }
    #search { width: 100%; }

    /* Two-handle frequency slider: two ranges on one track. */
    .dual { position: relative; height: 26px; margin-top: 4px; }
    .dual .track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: rgba(255, 255, 255, 0.10); }
    .dual .fill { position: absolute; top: 11px; height: 4px; background: linear-gradient(90deg, var(--low), #ffd25c, #6fe08b, #5ab8ff, var(--high)); }
    .dual input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
    .dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 14px; height: 20px; background: #e9eef8; border: 1px solid #0b101d; cursor: ew-resize; }
    .dual input::-moz-range-thumb { pointer-events: auto; width: 13px; height: 19px; background: #e9eef8; border: 1px solid #0b101d; border-radius: 0; cursor: ew-resize; }
    .dual input::-moz-range-track { background: none; }
    .facts { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin-top: 6px; font-size: 12px; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; font-variant-numeric: tabular-nums; }

    .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
    .layers label { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; font-size: 12.5px; }
    .layers input { accent-color: var(--accent); margin: 0; }
    .sw { display: inline-block; width: 9px; height: 9px; flex: none; }
    .fade { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .fade input { flex: 1; accent-color: var(--accent); }

    ul.list { list-style: none; margin: 0; padding: 0; }
    ul.list li { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 3px 0; cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
    ul.list li:hover { background: rgba(255, 255, 255, 0.04); }
    ul.list .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    ul.list .v { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
    ul.list .d { grid-column: 1 / -1; color: var(--faint); font-size: 11px; }
    .tag { display: inline-block; font-size: 10px; padding: 0 4px; margin-right: 5px; border: 1px solid currentColor; vertical-align: 1px; letter-spacing: 0.04em; }
    .t-cal { color: var(--gold); } .t-src { color: #ffb46e; } .t-psr { color: var(--pulsar); }
    .t-dump { color: var(--dump); } .t-sun { color: #ffe08a; } .t-moon { color: #e9e6dc; } .t-star { color: #c9d3ea; }
    .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .empty { color: var(--faint); font-size: 12px; }
    footer { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
    footer .btn { flex: 1; }

    #card {
      position: fixed; top: 12px; right: 12px; width: 300px; background: var(--panel); backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); padding: 12px 14px; max-height: calc(100vh - 24px); overflow-y: auto;
    }
    #card h3 { margin: 0 0 2px; font-size: 16px; font-weight: 600; padding-right: 24px; }
    #card .kind { color: var(--muted); margin-bottom: 8px; }
    #card .close { position: absolute; top: 8px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
    #card .facts { font-size: 12.5px; }
    #card p { margin: 8px 0 0; color: var(--muted); }

    #hint { position: fixed; top: 12px; right: 14px; color: var(--faint); font-size: 11.5px; pointer-events: none; text-align: right; }
    #card:not([hidden]) ~ #hint { display: none; }
    #toggle { display: none; position: fixed; top: 10px; left: 10px; z-index: 3; }
    #error { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

    dialog { background: var(--panel-solid); color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.14); max-width: min(560px, calc(100vw - 32px)); padding: 18px 20px; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    dialog h2 { font-size: 12px; }
    dialog p, dialog li { color: #cdd4e2; }
    dialog ul { padding-left: 18px; }
    dialog a { color: var(--accent); }
    dialog pre { white-space: pre-wrap; font-size: 10.5px; color: var(--muted); max-height: 160px; overflow: auto; border: 1px solid var(--line); padding: 8px; }
    .steps { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
    .steps span { color: var(--faint); }

    body.kiosk #panel, body.kiosk #toggle, body.kiosk #hint, body.kiosk #card { display: none; }
    body.kiosk #sky { cursor: none; }

    @media (max-width: 720px) {
      #toggle { display: block; }
      #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 62vh; border-width: 1px 0 0; transform: translateY(100%); transition: transform 0.2s; padding: 12px 16px; }
      body.panel-open #panel { transform: none; }
      #card { left: 16px; right: 16px; width: auto; top: 52px; max-height: 45vh; }
      #hint, #trace { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="The sky above the CHORD pathfinder"></canvas>
  <canvas id="ov"></canvas>
  <canvas id="fx"></canvas>
  <canvas id="trace" aria-label="Model of the sky brightness in the beam over the next day"></canvas>

  <button id="toggle" class="btn" aria-expanded="false" aria-controls="panel">Controls</button>

  <aside id="panel" aria-label="Controls">
    <div class="brand"><b>CHORD</b><span>observatory</span></div>
    <div class="site" id="site-name"></div>
    <input id="search" type="search" list="names" placeholder="Find a source, pulsar or star" autocomplete="off" />
    <datalist id="names"></datalist>

    <section aria-label="Time">
      <div id="t-local">–</div>
      <div class="sub" id="t-utc">–</div>
      <div class="sub" id="t-lst">–</div>
      <div class="row">
        <button class="btn" id="live" aria-pressed="true" title="Follow the clock (N)"><span class="live-dot"></span>Now</button>
        <span class="seg">
          <button class="btn" id="rew" title="Faster backward">◀◀</button>
          <button class="btn" id="play" title="Play or pause (space)">❚❚</button>
          <button class="btn" id="ffw" title="Faster forward">▶▶</button>
        </span>
        <span id="speed">1×</span>
      </div>
      <div class="row">
        <input id="t-input" type="datetime-local" step="1" aria-label="Time, UTC" />
        <span class="sub">UTC</span>
      </div>
    </section>

    <section aria-label="Pointing">
      <h2>Pointing <small id="point-note"></small></h2>
      <div class="row" style="margin-top:0">
        <span class="seg" id="pointings"></span>
        <label class="sub">Dec <input id="dec-input" type="number" min="-30" max="90" step="0.1" aria-label="Declination, degrees" /></label>
      </div>
    </section>

    <section aria-label="View">
      <h2>View</h2>
      <div class="row" style="margin-top:0">
        <span class="seg">
          <button class="btn" data-view="dome" title="The sky above the site (D)">Dome</button>
          <button class="btn" data-view="chart" title="The whole sky as a map (D)">Chart</button>
        </span>
        <span class="seg" id="chart-opts">
          <button class="btn" data-frame="eq" title="Equatorial (RA, Dec)">Eq</button>
          <button class="btn" data-frame="gal" title="Galactic">Gal</button>
          <button class="btn" data-proj="1" title="Mollweide">Moll</button>
          <button class="btn" data-proj="2" title="Rectangular (plate carrée)">Rect</button>
        </span>
      </div>
    </section>

    <section aria-label="Frequency and beam">
      <h2>Band <small id="band-text"></small></h2>
      <div class="dual">
        <div class="track"></div><div class="fill" id="band-fill"></div>
        <input type="range" id="f-lo" min="150" max="1600" step="10" aria-label="Lowest frequency, MHz" />
        <input type="range" id="f-hi" min="150" max="1600" step="10" aria-label="Highest frequency, MHz" />
      </div>
      <dl class="facts" id="band-facts"></dl>
      <div class="row">
        <span class="sub">Beam</span>
        <span class="seg">
          <button class="btn" data-beam="off">Off</button>
          <button class="btn" data-beam="dish" title="One dish: the primary beam">Dish</button>
          <button class="btn" data-beam="array" title="The 8 × 8 array phased to the beam centre (grating lobes)">Array</button>
        </span>
      </div>
    </section>

    <section aria-label="Layers">
      <h2>Layers</h2>
      <div class="layers" id="layers"></div>
      <div class="fade"><span>Radio sky</span><input type="range" id="sky-gain" min="0" max="100" aria-label="Radio sky brightness" /></div>
    </section>

    <section aria-label="In the beam now">
      <h2>In the beam now <small id="inbeam-f"></small></h2>
      <ul class="list" id="inbeam"></ul>
    </section>

    <section aria-label="Coming up">
      <h2>Coming through the strip</h2>
      <ul class="list" id="upnext"></ul>
      <div class="note" id="sun-note"></div>
    </section>

    <footer>
      <button class="btn" id="explain-btn">How to read this</button>
      <button class="btn" id="credits-btn">Credits</button>
    </footer>
  </aside>

  <div id="card" hidden></div>
  <div id="hint">Drag to look around · scroll to zoom · select an object for details</div>
  <div id="error"></div>

  <dialog id="explain">
    <h2 id="ex-title"></h2>
    <p id="ex-body"></p>
    <div class="steps">
      <button class="btn" id="ex-prev">Back</button>
      <span id="ex-count"></span>
      <button class="btn" id="ex-next">Next</button>
    </div>
  </dialog>

  <dialog id="credits">
    <h2>Credits</h2>
    <ul id="credit-list"></ul>
    <pre id="d3c-license"></pre>
    <div class="steps"><span></span><button class="btn" id="credits-close">Close</button></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
